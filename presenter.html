<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter · Od AI slopu k rozumné kreativě</title>
<style>
:root{
  --bg:#111013; --panel:#1b1a1e; --line:#2c2a30;
  --ink:#f4f1ea; --muted:#9a95a1; --accent:#ff8aa0; --gold:#ffd363;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}

.wrap{display:grid;grid-template-columns:1.55fr 1fr;grid-template-rows:1fr auto;
      height:100vh;gap:14px;padding:14px}

.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      overflow:hidden;display:flex;flex-direction:column;min-height:0}
.pane>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
          padding:9px 13px;border-bottom:1px solid var(--line);flex:none}
.hd b{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.18em;
      text-transform:uppercase;color:var(--accent)}
.hd .sub{font-family:var(--mono);font-size:.7rem;color:var(--muted);
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* rámeček, do kterého se vejde odškálovaný iframe 1280×720.
   Iframe je absolutní a centruje se translatem, ne gridem — jinak by se
   neškálovaný box 1280 px ořízl dřív, než se stihne zmenšit. */
.stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
.stage .fit{position:absolute;inset:0}
.stage iframe{position:absolute;left:50%;top:50%;width:1280px;height:720px;border:0;
              transform-origin:center center;background:#fbf7f6}
.stage .end{position:absolute;inset:0;display:none;place-items:center;
            font-family:var(--mono);font-size:.85rem;color:var(--muted);letter-spacing:.1em;background:#000}
body.at-end .stage.next .end{display:grid}
body.at-end .stage.next .fit{display:none}

/* pravý sloupec: další slide nahoře, poznámky pod ním */
.side{display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;min-height:0}
.side>.pane:first-child .stage{flex:none;aspect-ratio:16/9}
.notes{padding:14px 16px;overflow:auto;font-size:1.02rem;line-height:1.55;color:var(--ink)}
.notes .empty{color:var(--muted);font-size:.92rem;line-height:1.5}
.notes .empty code{font-family:var(--mono);font-size:.85em;color:var(--gold)}

/* spodní lišta */
.bar{grid-column:1/-1;display:flex;align-items:center;gap:16px;
     background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.count{font-family:var(--mono);font-size:1.5rem;font-weight:600;letter-spacing:.04em}
.count small{color:var(--muted);font-weight:400;font-size:1rem}
.clock{font-family:var(--mono);font-size:1.5rem;font-weight:600;letter-spacing:.04em;color:var(--gold)}
.clock.over{color:var(--accent)}
.meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);
      flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font-family:var(--sans);font-size:.86rem;font-weight:500;color:var(--ink);
       background:#26242a;border:1px solid var(--line);border-radius:9px;
       padding:.5rem .85rem;cursor:pointer;white-space:nowrap}
button:hover{background:#312e37}
button.primary{background:var(--accent);border-color:var(--accent);color:#2a0a12;font-weight:600}
.progress{position:fixed;left:0;top:0;height:2px;background:var(--accent);width:0;transition:width .25s ease;z-index:9}

/* stav spojení */
.dot{width:.5rem;height:.5rem;border-radius:999px;background:#c8324a;flex:none}
.dot.live{background:#28c840}

@media(max-width:1100px){.wrap{grid-template-columns:1fr}.side{grid-row:2}}
</style>
</head>
<body>

<div class="progress" id="prog"></div>

<div class="wrap">
  <div class="pane">
    <div class="hd"><b>Teď na plátně</b><span class="sub" id="labelNow">—</span></div>
    <div class="stage"><div class="fit"><iframe id="fNow" src="index.html#view=current" title="Aktuální slide"></iframe></div></div>
  </div>

  <div class="side">
    <div class="pane">
      <div class="hd"><b>Další</b><span class="sub" id="labelNext">—</span></div>
      <div class="stage next">
        <div class="fit"><iframe id="fNext" src="index.html#view=next" title="Následující slide"></iframe></div>
        <div class="end">konec prezentace</div>
      </div>
    </div>
    <div class="pane">
      <div class="hd"><b>Poznámky</b></div>
      <div class="notes" id="notes"></div>
    </div>
  </div>

  <div class="bar">
    <span class="dot" id="dot" title="spojení s prezentací"></span>
    <span class="count"><span id="cur">–</span><small> / <span id="tot">–</span></small></span>
    <span class="clock" id="clock">00:00</span>
    <button id="btnTimer">Pauza</button>
    <button id="btnReset">Vynulovat</button>
    <span class="meta" id="meta">Prezentaci otevři tlačítkem vpravo a přetáhni ji na projektor.</span>
    <button id="btnPrev">◀ Zpět</button>
    <button id="btnNext">Dál ▶</button>
    <button class="primary" id="btnOpen">Otevřít prezentaci</button>
  </div>
</div>

<script>
(function(){
  var ch=null;
  try{ ch=new BroadcastChannel('rellmo-deck'); }catch(e){}

  var elCur=document.getElementById('cur'), elTot=document.getElementById('tot'),
      elNow=document.getElementById('labelNow'), elNext=document.getElementById('labelNext'),
      elNotes=document.getElementById('notes'), elMeta=document.getElementById('meta'),
      elDot=document.getElementById('dot'), elProg=document.getElementById('prog');

  var EMPTY='<p class="empty">K tomuhle slidu nejsou poznámky. Přidat je můžeš do fragmentu: '+
            '<code>&lt;section class="slide" data-notes="…"&gt;</code></p>';
  elNotes.innerHTML=EMPTY;

  // --- škálování náhledů: iframe je 1280×720, vejde se do rámečku ---
  function fit(){
    document.querySelectorAll('.stage .fit').forEach(function(f){
      var box=f.getBoundingClientRect(), fr=f.querySelector('iframe');
      var k=Math.min(box.width/1280, box.height/720);
      fr.style.transform='translate(-50%,-50%) scale('+Math.max(k,0.05)+')';
    });
  }
  window.addEventListener('resize',fit);
  window.addEventListener('load',fit); fit();

  // --- stav z živého decku ---
  var lastSeen=0, total=0;
  function tidy(s){ return (s||'').replace(/^S\S*\s*·\s*/,''); }

  if(ch){
    ch.onmessage=function(e){
      var m=e.data||{};
      if(m.type!=='state') return;
      lastSeen=Date.now(); elDot.classList.add('live');
      total=m.total;
      elCur.textContent=m.i+1; elTot.textContent=m.total;
      elProg.style.width=((m.i+1)/m.total*100)+'%';
      elNow.textContent=tidy(m.label)||'—';
      elNext.textContent=(m.i+1<m.total)?(tidy(m.nextLabel)||'—'):'—';
      document.body.classList.toggle('at-end', m.i+1>=m.total);
      elNotes.innerHTML = m.notes ? m.notes.replace(/&/g,'&amp;').replace(/</g,'&lt;') : EMPTY;
      elMeta.textContent='Šipky ovládají prezentaci odsud i z ní.';
    };
    ch.postMessage({type:'ping'});
    setInterval(function(){ ch.postMessage({type:'ping'}); },2000);
    setInterval(function(){
      if(Date.now()-lastSeen>5000){ elDot.classList.remove('live'); }
    },1000);
  }else{
    elMeta.textContent='Tenhle prohlížeč neumí propojit okna. Zkus Chrome nebo Edge.';
  }

  function nav(d){ if(ch) ch.postMessage({type:'nav', d:d}); }
  document.getElementById('btnPrev').onclick=function(){nav(-1);};
  document.getElementById('btnNext').onclick=function(){nav(1);};
  document.getElementById('btnOpen').onclick=function(){
    window.open('index.html','rellmo-deck-live');
  };

  window.addEventListener('keydown',function(e){
    if(['ArrowDown','ArrowRight','PageDown',' '].indexOf(e.key)>-1){e.preventDefault();nav(1);}
    else if(['ArrowUp','ArrowLeft','PageUp'].indexOf(e.key)>-1){e.preventDefault();nav(-1);}
  });

  // --- stopky ---
  var t0=Date.now(), acc=0, running=true, LIMIT=40*60; // blok Radim 10:35 až 11:15
  var elClock=document.getElementById('clock'), btnT=document.getElementById('btnTimer');
  function pad(n){return (n<10?'0':'')+n;}
  setInterval(function(){
    var s=Math.floor((acc+(running?Date.now()-t0:0))/1000);
    elClock.textContent=pad(Math.floor(s/60))+':'+pad(s%60);
    elClock.classList.toggle('over', s>LIMIT);
  },250);
  btnT.onclick=function(){
    if(running){ acc+=Date.now()-t0; running=false; btnT.textContent='Spustit'; }
    else { t0=Date.now(); running=true; btnT.textContent='Pauza'; }
  };
  document.getElementById('btnReset').onclick=function(){ acc=0; t0=Date.now(); };
})();
</script>
</body>
</html>
